<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { font-family: system-ui, sans-serif; padding: 16px; margin: 0; background: transparent; color: inherit; }
h3 { margin: 0 0 12px; font-size: 11px; opacity: 0.5; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
label { font-size: 11px; opacity: 0.5; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; }
select, input { width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; background: transparent; color: inherit; font-size: 13px; margin-bottom: 12px; }
button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #0071e3; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
button:hover { background: #0077ed; }
button:disabled { opacity: 0.5; cursor: default; }
h4 { margin: 14px 0 6px; font-size: 10px; opacity: 0.4; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
#log-output { font-size: 11px; font-family: monospace; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); }
#template-notes-section { margin-top: 14px; }
.template-note { font-size: 11px; font-family: monospace; white-space: pre-wrap; word-break: break-all; padding: 8px 10px; margin-bottom: 6px; border-radius: 8px; background: rgba(255,255,255,0.05); border-left: 3px solid rgba(255,255,255,0.2); }
.template-note h4 { margin: 0 0 4px; font-size: 9px; opacity: 0.35; }
.note-meta { font-size: 10px; opacity: 0.4; margin-bottom: 4px; }
.note-text { font-size: 11px; line-height: 1.4; }
.timestamp { opacity: 0.5; }
.tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-right: 6px; }
.tag-info { background: #0071e3; }
.tag-warn { background: #f5a623; }
.tag-error { background: #ff3b30; }
.tag-note { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<h3>Log Writer</h3>
<label for="logType">Log Type</label>
<select id="logType"><option value="info">Info</option><option value="warn">Warn</option><option value="error">Error</option></select>
<label for="logMessage">Message</label>
<input id="logMessage" type="text" placeholder="Enter log message...">
<button id="runBtn">Write Log</button>
<div id="log-output"></div>
<div id="template-notes-section"></div>
<script>
function renderLogs(logs) {
  const output = document.getElementById("log-output");
  output.innerHTML = logs.map(entry => `<span class="tag tag-${entry.logType}">${entry.logType.toUpperCase()}</span><span class="timestamp">[${entry.timestamp}]</span> ${entry.message}<br>`).join("");
}
function renderTemplateNotes(notes) {
  const section = document.getElementById("template-notes-section");
  notes.sort((a, b) => b.date.localeCompare(a.date));
  section.innerHTML = `<h4>From Template Notes</h4>` + notes.map(n => `
    <div class="template-note">
      <div class="note-meta"><span class="tag tag-note">NOTE</span><span class="timestamp">${n.date}</span></div>
      <div class="note-text">${n.text}</div>
    </div>
  `).join("");
}
async function loadLogs() {
  try {
    const stored = await bridge.storage.get("logs");
    if (stored) renderLogs(stored);
  } catch (e) {}
  try {
    const templateNotes = await bridge.storage.get("_trifecta_notes");
    if (templateNotes && templateNotes.length) renderTemplateNotes(templateNotes);
  } catch (e) {}
}
document.getElementById("runBtn").addEventListener("click", async () => {
  const btn = document.getElementById("runBtn");
  const logType = document.getElementById("logType").value;
  const message = document.getElementById("logMessage").value.trim();
  const output = document.getElementById("log-output");
  if (!message) { output.textContent = "Please enter a message."; return; }
  btn.disabled = true;
  btn.textContent = "Writing...";
  output.textContent = "";
  try {
    const now = new Date().toLocaleTimeString();
    const entry = { logType, message, timestamp: now };
    const stored = await bridge.storage.get("logs") || [];
    stored.unshift(entry);
    await bridge.storage.set("logs", stored);
    renderLogs(stored);
    document.getElementById("logMessage").value = "";
  } catch (e) {
    output.textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Write Log";
  }
});
loadLogs();
</script>
</body>
</html>
